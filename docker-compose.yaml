version: '3.8'
services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
    - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    image: priyanshu0906/my-springboot-app
    container_name: backend_app
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: "mongodb://mongodb:27017"

volumes:
  mongodb_data:
