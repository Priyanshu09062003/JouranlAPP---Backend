apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: journal-ingress
  annotations:
    kubernetes.io/ingress.class: gce # standard Google Cloud HTTP(S) Load Balancer
    # Enable container-native load balancing via Network Endpoint Groups (NEGs)
    # This enables direct routing from the load balancer to the pods for lower latency
    cloud.google.com/neg: '{"ingress": true}'
spec:
  rules:
    - http:
        paths:
          # Backend paths route to the Spring Boot service
          - path: /public
            pathType: Prefix
            backend:
              service:
                name: journal-backend-service
                port:
                  number: 8081
          - path: /journal
            pathType: Prefix
            backend:
              service:
                name: journal-backend-service
                port:
                  number: 8081
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: journal-backend-service
                port:
                  number: 8081
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: journal-backend-service
                port:
                  number: 8081
          # Default route/root routes to Nginx serving the React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: journal-frontend-service
                port:
                  number: 80
