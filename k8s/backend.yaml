apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-backend
  labels:
    app: journal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal-backend
  template:
    metadata:
      labels:
        app: journal-backend
    spec:
      containers:
        - name: backend
          image: gcr.io/my-gcp-project/journal-backend:latest # Placeholder to be updated with user's actual image name
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "journaldb"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
          livenessProbe:
            httpGet:
              path: /public/health-check
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /public/health-check
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
apiVersion: v1
kind: Service
metadata:
  name: journal-backend-service
  labels:
    app: journal-backend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: journal-backend
